<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Circle -->
  <circle cx="256" cy="220" r="160" fill="#6366f1" opacity="0.15" />

  <!-- Architectural 'A' / Compass Symbol -->
  <g filter="url(#glow)">
    <path d="M 256 110 L 380 370 L 320 370 L 256 235 L 192 370 L 132 370 Z" fill="url(#symbolGrad)"/>
    <rect x="200" y="270" width="112" height="28" rx="6" fill="url(#symbolGrad)"/>
  </g>

  <!-- Golden Central Pillar Accent -->
  <rect x="246" y="160" width="20" height="200" rx="10" fill="#f59e0b"/>
</svg>
